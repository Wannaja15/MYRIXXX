
name: MYRIX - Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ZIP and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          python -m pip install Pillow

      - name: Extract MYRIX project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 -type f -iname '*.zip' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP MYRIX tidak ditemukan."
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan dalam ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyek ditemukan: $PROJECT_DIR"

          if [ -f "$GITHUB_WORKSPACE/myrix-logo.png" ]; then
            cp "$GITHUB_WORKSPACE/myrix-logo.png" \
              "$PROJECT_DIR/myrix-logo.png"
          fi

      - name: Generate MYRIX launcher icons
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          logo_path = Path("myrix-logo.png")
          if not logo_path.exists():
              logo_path = Path("app/src/main/assets/logo.png")

          if not logo_path.exists():
              print("Logo tidak ditemukan; ikon bawaan dipertahankan.")
              raise SystemExit(0)

          logo = Image.open(logo_path).convert("RGBA")
          side = max(logo.size)
          canvas = Image.new("RGBA", (side, side), (0, 0, 0, 0))
          canvas.alpha_composite(
              logo,
              ((side - logo.width) // 2,
               (side - logo.height) // 2)
          )

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          for density, size in sizes.items():
              folder = Path(f"app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              icon = canvas.resize(
                  (size, size), Image.Resampling.LANCZOS
              )
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          print("Ikon MYRIX selesai dibuat.")
          PY

      - name: Validate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -f app/src/main/AndroidManifest.xml

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            exit 1
          fi

          if [ ! -f build.gradle ] && \
             [ ! -f build.gradle.kts ]; then
            echo "ERROR: build.gradle tidak ditemukan."
            exit 1
          fi

          if [ ! -f app/build.gradle ] && \
             [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: app/build.gradle tidak ditemukan."
            exit 1
          fi

          echo "Struktur proyek Android lolos pemeriksaan."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK_ROOT"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Mencari sdkmanager di lokasi SDK..."
            SDKMANAGER=$(find /usr/local/lib/android \
              -type f -name sdkmanager 2>/dev/null | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan di runner."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build MYRIX APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRIX-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
