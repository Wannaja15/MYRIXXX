name: MYRIX - Check, Logo & Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install image tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Generate MYRIX launcher icons
        run: |
          if [ -f myrix-logo.png ]; then
            python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path

          logo = Image.open("myrix-logo.png").convert("RGBA")

          # Fit logo into a transparent square canvas.
          side = max(logo.width, logo.height)
          canvas = Image.new("RGBA", (side, side), (0, 0, 0, 0))
          canvas.alpha_composite(
              logo,
              ((side - logo.width) // 2,
               (side - logo.height) // 2)
          )

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          for density, size in sizes.items():
              folder = Path(
                  f"app/src/main/res/mipmap-{density}"
              )
              folder.mkdir(parents=True, exist_ok=True)

              icon = canvas.resize(
                  (size, size), Image.Resampling.LANCZOS
              )
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          print("MYRIX launcher icons generated.")
          PY
          else
            echo "myrix-logo.png not found; using existing icons."
          fi

      - name: Validate project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Run available project tests
        run: |
          if [ -f scripts/validate-project.py ]; then
            python scripts/validate-project.py
          fi

          for test in \
            scripts/test-effects.cjs \
            scripts/test-beat-editor.cjs \
            scripts/test-motion-editor.cjs \
            scripts/test-shape-free-motion.cjs \
            scripts/test-fixed-beat-controls.cjs
          do
            if [ -f "$test" ]; then
              node "$test"
            else
              echo "Skipping unavailable test: $test"
            fi
          done

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build MYRIX APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRIX-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
