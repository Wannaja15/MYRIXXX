
name: MYRIX 2.1.3 - Clear UI & Live Playhead

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myrix-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate project and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare source project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"

          if [[ ! -f "$ROOT/settings.gradle" || ! -f "$ROOT/app/build.gradle" ]]; then
            ZIP_FILE="$(find "$ROOT" -maxdepth 1 -type f \( -iname '*.zip' \) -print -quit || true)"
            if [[ -n "$ZIP_FILE" ]]; then
              mkdir -p "$ROOT/.myrix-build-source"
              unzip -oq "$ZIP_FILE" -d "$ROOT/.myrix-build-source"
            fi
          fi

          PROJECT_SETTINGS=""
          if [[ -f "$ROOT/settings.gradle" && -f "$ROOT/app/build.gradle" ]]; then
            PROJECT_SETTINGS="$ROOT/settings.gradle"
          else
            while IFS= read -r candidate; do
              candidate_dir="$(dirname "$candidate")"
              if [[ -f "$candidate_dir/app/build.gradle" && -f "$candidate_dir/app/src/main/assets/index.html" ]]; then
                PROJECT_SETTINGS="$candidate"
                break
              fi
            done < <(find "$ROOT" -type f -name settings.gradle \
              -not -path '*/.git/*' -not -path '*/.gradle/*' -print)
          fi

          if [[ -z "$PROJECT_SETTINGS" ]]; then
            echo "ERROR: Proyek Android MYRIX tidak ditemukan."
            echo "Unggah isi proyek atau ZIP proyek ke repository."
            find "$ROOT" -maxdepth 4 -type f | sort | head -120
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          test -f "$PROJECT_DIR/app/src/main/java/com/myrix/editor/MainActivity.java"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate MYRIX project and features
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 scripts/validate-project.py
          node scripts/test-effects.cjs
          node scripts/test-beat-editor.cjs
          node scripts/test-motion-editor.cjs
          node scripts/test-shape-free-motion.cjs
          node scripts/test-fixed-beat-controls.cjs
          node scripts/test-crop-and-trim.cjs
          node scripts/test-split-layer-v2.cjs
          node scripts/test-editor-ui-v21.cjs
          node scripts/test-compact-editor-ui-v211.cjs
          node scripts/test-autosave-on-exit.cjs
          node scripts/test-numeric-transform-z-v212.cjs
          node scripts/test-playhead-ui-v213.cjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          gradle --no-daemon --stacktrace :app:assembleDebug

          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p "$GITHUB_WORKSPACE/MYRIX-debug-APK"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/MYRIX-debug-APK/app-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRIX-debug-APK
          path: MYRIX-debug-APK/app-debug.apk
          if-no-files-found: error
          retention-days: 14
