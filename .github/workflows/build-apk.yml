
name: MYRIX 2.1.5 - Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myrix-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate project and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare MYRIX Android project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          PROJECT_SETTINGS=""

          find_project() {
            while IFS= read -r file; do
              DIR="$(dirname "$file")"

              if [[ -f "$DIR/app/build.gradle" ]] &&
                 [[ -f "$DIR/app/src/main/assets/index.html" ]] &&
                 [[ -f "$DIR/app/src/main/AndroidManifest.xml" ]]; then
                PROJECT_SETTINGS="$file"
                return 0
              fi
            done < <(
              find "$1" \
                -type f \
                -name settings.gradle \
                -not -path '*/.git/*' \
                -not -path '*/.gradle/*' \
                -print
            )

            return 1
          }

          if ! find_project "$ROOT"; then
            ZIP_FILE="$(find "$ROOT" -maxdepth 1 -type f -iname '*.zip' -print -quit || true)"

            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: ZIP proyek MYRIX tidak ditemukan di root repository."
              exit 1
            fi

            mkdir -p "$ROOT/.myrix-source"
            unzip -oq "$ZIP_FILE" -d "$ROOT/.myrix-source"

            if ! find_project "$ROOT/.myrix-source"; then
              echo "ERROR: ZIP tidak berisi proyek Android yang valid."
              find "$ROOT/.myrix-source" -maxdepth 5 -type f | head -150
              exit 1
            fi
          fi

          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyek ditemukan: $PROJECT_DIR"

          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" \
            -type f -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1)"

          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Validate project and run feature tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 scripts/validate-project.py

          for test in \
            scripts/test-effects.cjs \
            scripts/test-beat-editor.cjs \
            scripts/test-motion-editor.cjs \
            scripts/test-shape-free-motion.cjs \
            scripts/test-fixed-beat-controls.cjs \
            scripts/test-crop-and-trim.cjs \
            scripts/test-split-layer-v2.cjs \
            scripts/test-editor-ui-v21.cjs \
            scripts/test-compact-editor-ui-v211.cjs \
            scripts/test-autosave-on-exit.cjs \
            scripts/test-numeric-transform-z-v212.cjs \
            scripts/test-playhead-ui-v213.cjs \
            scripts/test-transform-keyframes-v214.cjs \
            scripts/test-audio-playback-playhead-v215.cjs
          do
            if [[ -f "$test" ]]; then
              echo "Menjalankan $test"
              node "$test"
            else
              echo "ERROR: Tes tidak ditemukan: $test"
              exit 1
            fi
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace :app:assembleDebug

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "ERROR: APK tidak berhasil dibuat."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/MYRIX-debug-APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/MYRIX-debug-APK/MYRIX-2.1.5-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRIX-2.1.5-debug-APK
          path: MYRIX-debug-APK/MYRIX-2.1.5-debug.apk
          if-no-files-found: error
          retention-days: 14
