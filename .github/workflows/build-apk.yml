
name: MYRIX 2.1.3 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: myrix-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate project and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Locate and prepare MYRIX project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          PROJECT=""

          # Cari proyek Android yang sudah diekstrak.
          while IFS= read -r file; do
            dir="$(dirname "$file")"
            if [[ -f "$dir/app/build.gradle" || -f "$dir/app/build.gradle.kts" ]]; then
              PROJECT="$dir"
              break
            fi
          done < <(
            find "$ROOT" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' -print
          )

          # Kalau belum ada, ekstrak ZIP proyek di root repository.
          if [[ -z "$PROJECT" ]]; then
            ZIP_FILE="$(find "$ROOT" -maxdepth 1 -type f \
              -iname '*.zip' -print -quit || true)"

            if [[ -n "$ZIP_FILE" ]]; then
              mkdir -p "$ROOT/.myrix-extracted"
              unzip -oq "$ZIP_FILE" -d "$ROOT/.myrix-extracted"

              while IFS= read -r file; do
                dir="$(dirname "$file")"
                if [[ -f "$dir/app/build.gradle" || -f "$dir/app/build.gradle.kts" ]]; then
                  PROJECT="$dir"
                  break
                fi
              done < <(
                find "$ROOT/.myrix-extracted" -type f \
                  \( -name settings.gradle -o -name settings.gradle.kts \) \
                  -print
              )
            fi
          fi

          if [[ -z "$PROJECT" ]]; then
            echo "ERROR: Proyek Android tidak ditemukan."
            echo "Pastikan ZIP proyek MYRIX diunggah ke root repository."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Proyek ditemukan: $PROJECT"

          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/src/main/assets/index.html"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [[ ! -d "$SDK" ]]; then
            SDK="/usr/local/lib/android/sdk"
          fi

          if [[ ! -d "$SDK" ]]; then
            echo "ERROR: Android SDK tidak ditemukan di runner."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=""
          for candidate in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" \
              -type f -name sdkmanager -path '*/bin/sdkmanager' \
              2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            find "$SDK" -maxdepth 4 -type f -name sdkmanager || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Validate project and run available tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [[ -f scripts/validate-project.py ]]; then
            python3 scripts/validate-project.py
          fi

          # Jalankan tes yang memang tersedia di proyek.
          for test in \
            scripts/test-effects.cjs \
            scripts/test-beat-editor.cjs \
            scripts/test-motion-editor.cjs \
            scripts/test-shape-free-motion.cjs \
            scripts/test-fixed-beat-controls.cjs \
            scripts/test-crop-and-trim.cjs \
            scripts/test-split-layer-v2.cjs \
            scripts/test-editor-ui-v21.cjs \
            scripts/test-compact-editor-ui-v211.cjs \
            scripts/test-autosave-on-exit.cjs \
            scripts/test-numeric-transform-z-v212.cjs \
            scripts/test-playhead-ui-v213.cjs
          do
            if [[ -f "$test" ]]; then
              echo "Menjalankan $test"
              node "$test"
            fi
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build MYRIX debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [[ -f gradlew ]]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi

          APK="$(find app/build/outputs/apk -type f \
            -name '*.apk' -print -quit)"

          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "ERROR: APK tidak ditemukan setelah build."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/MYRIX-APK"
          cp "$APK" "$GITHUB_WORKSPACE/MYRIX-APK/MYRIX-debug.apk"

          echo "APK berhasil dibuat: MYRIX-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MYRIX-2.1.3-debug-APK
          path: MYRIX-APK/MYRIX-debug.apk
          if-no-files-found: error
          retention-days: 14
