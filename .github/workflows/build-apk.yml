
name: MYRIX APK Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MYRIX APK
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Ambil kode dari GitHub
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK tanpa paket tools lama
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK tidak ditemukan: $SDK"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -path '*/bin/sdkmanager' \
            -print 2>/dev/null | sort -V | tail -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Periksa file proyek MYRIX
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f MYRIX_2_2_0_RELEASE.zip ]; then
            echo "ERROR: MYRIX_2_2_0_RELEASE.zip tidak ditemukan."
            echo "Unggah ZIP ke halaman utama repositori GitHub."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/myrix-source"
          unzip -oq MYRIX_2_2_0_RELEASE.zip \
            -d "$RUNNER_TEMP/myrix-source"

          PROJECT=""

          while IFS= read -r SETTINGS; do
            DIR="$(dirname "$SETTINGS")"

            if [ -f "$DIR/app/build.gradle" ] || \
               [ -f "$DIR/app/build.gradle.kts" ]; then
              PROJECT="$DIR"
              break
            fi
          done < <(
            find "$RUNNER_TEMP/myrix-source" \
              -type f \( -name settings.gradle \
              -o -name settings.gradle.kts \)
          )

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Proyek Android tidak ditemukan dalam ZIP."
            echo "ZIP harus berisi proyek Android lengkap, bukan HTML saja."
            exit 1
          fi

          if [ ! -f "$PROJECT/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml tidak ditemukan."
            exit 1
          fi

          echo "MYRIX_PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Proyek ditemukan: $PROJECT"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK MYRIX
        shell: bash
        run: |
          set -euo pipefail
          cd "$MYRIX_PROJECT"

          gradle --no-daemon --stacktrace \
            :app:assembleDebug

      - name: Periksa dan siapkan APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$MYRIX_PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK tidak berhasil dibuat."
            find "$MYRIX_PROJECT/app/build/outputs" \
              -type f -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/MYRIX-debug.apk
          sha256sum output/MYRIX-debug.apk \
            > output/SHA256SUMS.txt

          echo "APK berhasil dibuat."
          ls -lh output/

      - name: Simpan APK agar bisa diunduh
        uses: actions/upload-artifact@v4
        with:
          name: MYRIX-APK
          path: output/*
          if-no-files-found: error
          retention-days: 14
