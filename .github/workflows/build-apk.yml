name: MYRIX 2.1.4 - Time-Synced Transform

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myrix-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate project and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare source project (root, nested folder, or ZIP)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          PROJECT_SETTINGS=""

          locate_project() {
            while IFS= read -r candidate; do
              local candidate_dir
              candidate_dir="$(dirname "$candidate")"
              if [[ -f "$candidate_dir/app/build.gradle" && -f "$candidate_dir/app/src/main/assets/index.html" ]]; then
                PROJECT_SETTINGS="$candidate"
                return 0
              fi
            done < <(find "$1" -type f -name settings.gradle \
              -not -path '*/.git/*' -not -path '*/.gradle/*' -print 2>/dev/null)
            return 1
          }

          if ! locate_project "$ROOT"; then
            ZIP_FILE="$(find "$ROOT" -maxdepth 1 -type f \( -iname '*.zip' \) -print -quit || true)"
            if [[ -n "$ZIP_FILE" ]]; then
              mkdir -p "$ROOT/.myrix-build-source"
              unzip -oq "$ZIP_FILE" -d "$ROOT/.myrix-build-source"
              locate_project "$ROOT/.myrix-build-source" || true
            fi
          fi

          if [[ -z "$PROJECT_SETTINGS" ]]; then
            echo 'ERROR: Proyek Android MYRIX tidak ditemukan. Unggah isi proyek atau ZIP proyek di root repository.' >&2
            find "$ROOT" -maxdepth 4 -type f | sort | head -120
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project source located at: $PROJECT_DIR"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

      - name: Configure Android SDK (avoid obsolete tools package)
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [[ ! -d "$SDK" ]]; then
            SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          fi
          if [[ ! -d "$SDK" ]]; then
            echo 'ERROR: Android SDK was not found on this runner.' >&2
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo 'ERROR: sdkmanager not found in installed Android command-line tools.' >&2
            find "$SDK" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Validate project and run feature tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 scripts/validate-project.py
          for test in \
            scripts/test-effects.cjs \
            scripts/test-beat-editor.cjs \
            scripts/test-motion-editor.cjs \
            scripts/test-shape-free-motion.cjs \
            scripts/test-fixed-beat-controls.cjs \
            scripts/test-crop-and-trim.cjs \
            scripts/test-split-layer-v2.cjs \
            scripts/test-editor-ui-v21.cjs \
            scripts/test-compact-editor-ui-v211.cjs \
            scripts/test-autosave-on-exit.cjs \
            scripts/test-numeric-transform-z-v212.cjs \
            scripts/test-playhead-ui-v213.cjs \
            scripts/test-transform-keyframes-v214.cjs
          do
            test -f "$test"
            echo "Running $test"
            node "$test"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/MYRIX-debug-APK"
          cp "$APK" "$GITHUB_WORKSPACE/MYRIX-debug-APK/MYRIX-2.1.4-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRIX-2.1.4-debug-APK
          path: MYRIX-debug-APK/MYRIX-2.1.4-debug.apk
          if-no-files-found: error
          retention-days: 14
