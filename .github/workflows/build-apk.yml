name: Build MYRIX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MYRIX_GITHUB_PROJECT_FIXED.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ekstrak proyek MYRIX
        run: |
          mkdir myrix-source
          unzip -q MYRIX_GITHUB_PROJECT_FIXED.zip -d myrix-source
          cp -R myrix-source/. .

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRIX-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
