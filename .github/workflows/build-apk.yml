
name: MYRIX - Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract MYRIX ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 -type f -name '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP MYRIX tidak ditemukan."
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          SETTINGS=$(find extracted -type f \
            -name settings.gradle -print -quit)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find extracted -type f \
              -name settings.gradle.kts -print -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan dalam ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          if [ -f "$GITHUB_WORKSPACE/myrix-logo.png" ]; then
            cp "$GITHUB_WORKSPACE/myrix-logo.png" \
              "$PROJECT_DIR/myrix-logo.png"
          fi

          echo "Proyek ditemukan: $PROJECT_DIR"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Generate MYRIX launcher icons
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          logo_path = Path("myrix-logo.png")
          if not logo_path.exists():
              logo_path = Path("app/src/main/assets/logo.png")

          if not logo_path.exists():
              print("Logo tidak ditemukan; memakai ikon yang tersedia.")
              raise SystemExit(0)

          logo = Image.open(logo_path).convert("RGBA")
          side = max(logo.size)
          canvas = Image.new("RGBA", (side, side), (0, 0, 0, 0))
          canvas.alpha_composite(
              logo, ((side-logo.width)//2, (side-logo.height)//2)
          )

          sizes = {
              "mdpi": 48, "hdpi": 72, "xhdpi": 96,
              "xxhdpi": 144, "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = Path(f"app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              icon = canvas.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          print("Ikon MYRIX selesai dibuat.")
          PY

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/src/main/AndroidManifest.xml")
          manifest = path.read_text()
          start = manifest.find("<application")
          end = manifest.find(">", start)

          if start < 0 or end < 0:
              raise SystemExit("Tag application tidak ditemukan.")

          tag = manifest[start:end]
          if "android:icon=" not in tag:
              manifest = manifest[:end] + \
                  '\n        android:icon="@mipmap/ic_launcher"' + \
                  manifest[end:]
              end = manifest.find(">", start)

          tag = manifest[start:end]
          if "android:roundIcon=" not in tag:
              manifest = manifest[:end] + \
                  '\n        android:roundIcon="@mipmap/ic_launcher_round"' + \
                  manifest[end:]

          path.write_text(manifest)
          print("Manifest ikon diperbarui.")
          PY

      - name: Validate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build MYRIX APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRIX-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
